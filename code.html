<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing Awareness Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#121212;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:380px;
    background:#1e1e1e;
    padding:30px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

.warning{
    background:#ffc107;
    color:#000;
    padding:10px;
    border-radius:6px;
    margin-bottom:20px;
    font-weight:bold;
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #555;
    border-radius:6px;
    background:#2c2c2c;
    color:#fff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#0d6efd;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

.note{
    margin-top:20px;
    color:#bbb;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="warning">
⚠️ Educational Demonstration Only
</div>

<h2>Phishing Awareness Simulator</h2>

<p>This page demonstrates what a fake login page might look like. Do not enter any real passwords.</p>

<input type="text" placeholder="Demo Username">

<input type="password" placeholder="Demo Password">

<button id="demoBtn">Continue (Demo)</button>

<p class="note">
Cybersecurity Project<br>
Daystar University
</p>

</div>

<script>
document.getElementById("demoBtn").addEventListener("click", function () {
    alert("This is an educational demonstration only. No login has taken place.");
});
</script>

</body>
</html>
